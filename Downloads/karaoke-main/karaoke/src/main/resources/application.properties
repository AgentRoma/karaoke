spring.application.name=karaoke
server.port=${PORT:8080}

# Hasło administratora - KONIECZNIE ustaw przez zmienną środowiskową ADMIN_PASSWORD
# NIGDY nie wpisuj go tutaj w production!
admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.com.example.karaoke=DEBUG
logging.level.org.springframework.security=INFO

# Actuator (opcjonalnie - monitoring)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always